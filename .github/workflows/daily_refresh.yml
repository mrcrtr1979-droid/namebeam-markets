name: daily_refresh

# LB-24 (Terry's packet, 2026-11-09, part 1): the public record on markets.namebeam.ai froze because every dated page
# was a lane-built static (day pages stopped 2026-10-07, /record/ said 10-24, /buy/ said 10-16). This job runs every
# day after the collector lands (about 00:45Z) and the namebeam-site jobs (05:35Z, 05:50Z):
#   1. tools/daily_refresh.py      extends record/<slug>/all.csv, rows.csv, the day CSVs and summary.json from the
#                                  PUBLIC corpus columns only (counts, dates, status, the public names list; never
#                                  Perplexity answer text or sources) and writes data/latest.json, the ONE generated file.
#   2. tools/refresh_day_pages.py  writes the new per-day record pages, changes.csv, each market's day table, sitemap.xml.
#   3. tools/refresh_pages.py      rewrites every dated sentence on the home, /record/, /buy/, /agency/ and /check/
#                                  pages from data/latest.json through nb: markers, so no page can drift from another.
# Zero model calls, stdlib only, no secrets beyond the built-in GITHUB_TOKEN. Cloudflare Pages deploys main.

on:
  schedule:
    - cron: "40 6 * * *"   # 06:40 UTC = 12:40 AM CST / 1:40 AM CDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily_refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone the public corpus
        run: git clone --depth 1 https://github.com/mrcrtr1979-droid/namebeam-visibility-index.git /tmp/nvi

      - name: Refresh the record from the public corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          python3 -I -B tools/daily_refresh.py /tmp/nvi | tee /tmp/out/1_data.txt
          python3 -I -B tools/refresh_day_pages.py | tee /tmp/out/2_days.txt
          python3 -I -B tools/refresh_pages.py | tee /tmp/out/3_pages.txt

      - name: Scope guard (only the files this job owns may change)
        run: |
          set -euo pipefail
          git add -A
          CHANGED=$(git diff --cached --name-only)
          OUTSIDE=$(printf '%s\n' "$CHANGED" | grep -v -E '^(record/[a-z0-9-]+/([0-9]{4}-[0-9]{2}-[0-9]{2}(\.csv|/index\.html)|all\.csv|rows\.csv|changes\.csv|summary\.json|index\.html)|data/latest\.json|index\.html|record/index\.html|buy/index\.html|agency/index\.html|check/index\.html|sitemap\.xml)$' || true)
          if [ -n "$OUTSIDE" ]; then echo "REFUSED, files outside scope:"; echo "$OUTSIDE"; exit 1; fi
          echo "changed files: $(printf '%s\n' "$CHANGED" | grep -c . || true)"

      - name: Freshness gate (latest.json must be at most 2 days old)
        run: |
          python3 - <<'EOF'
          import json, datetime
          d = json.load(open('data/latest.json', encoding='utf-8'))
          lag = (datetime.date.today() - datetime.date.fromisoformat(d['latest_run_day'])).days
          print('latest_run_day', d['latest_run_day'], 'lag', lag, 'days; markets', d['totals']['markets'], 'rows', d['totals']['rows'])
          assert lag <= 2, 'latest_run_day is more than 2 days old; refusing to publish a stale record'
          EOF

      - name: Commit and push (Cloudflare Pages deploys main)
        run: |
          git config user.name  "carter-brain-actions"
          git config user.email "actions@namebeam.ai"
          if git diff --cached --quiet; then echo "record unchanged today"; exit 0; fi
          git commit -q -m "daily refresh $(date -u +%F): record through $(python3 -c 'import json; print(json.load(open("data/latest.json"))["latest_run_day"])') (tools/daily_refresh.py, zero model calls)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed, retrying"; sleep $((i*7))
          done
          echo "::error::could not push the daily refresh after 5 attempts"; exit 1

      - name: Job summary
        if: always()
        run: |
          { echo "## daily refresh $(date -u +%FT%TZ)"; echo; echo '```'; cat /tmp/out/*.txt 2>/dev/null | tail -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Sentry Crons (house pattern, same as carter-brain site_watch.yml): one check-in per run, never fails the job.
      - name: Report the run to Sentry Crons
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN || 'https://fac773179a0ef5c7296de8b92796d144@o4512319421349888.ingest.us.sentry.io/4512319519195136' }}
          DISABLE_SENTRY: ${{ vars.DISABLE_SENTRY }}
          JOB_STATUS: ${{ job.status }}
          SLUG: markets-daily-refresh
          CRON: "40 6 * * *"
          MARGIN: "600"
        run: |
          case "${DISABLE_SENTRY:-}" in ""|0|false|no|off) ;; *) echo "sentry disabled"; exit 0;; esac
          D="${SENTRY_DSN:-}"; [ -n "$D" ] || { echo "no SENTRY_DSN"; exit 0; }
          K="${D#https://}"; K="${K%%@*}"; H="${D#*@}"; P="${H#*/}"; H="${H%%/*}"
          S=error; [ "$JOB_STATUS" = success ] && S=ok
          B="{\"status\":\"$S\",\"monitor_config\":{\"schedule\":{\"type\":\"crontab\",\"value\":\"$CRON\"},\"checkin_margin\":$MARGIN,\"timezone\":\"UTC\",\"failure_issue_threshold\":2,\"recovery_threshold\":1}}"
          curl -sS -m 15 -o /dev/null -w "sentry $SLUG $S http %{http_code}\n" -X POST "https://$H/api/$P/cron/$SLUG/$K/" -H 'Content-Type: application/json' --data "$B" || echo "sentry check-in failed, ignored"
          exit 0
